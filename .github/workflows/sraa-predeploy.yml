# [F015][S006] SRAA — Security Risk Assessment gate before merge/deploy
name: SRAA Pre-Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit fix (safe)
        run: npm audit fix || true

      - name: npm audit gate (high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # Production deploys are owned by the Vercel Git integration.
  # The previous CLI deploy failed because secrets.VERCEL_TOKEN was empty.
  # Do NOT attach `environment: Production` here — that creates a GitHub
  # Deployment which would falsely satisfy a deployments-API poll.
  verify-vercel-production:
    name: Verify Vercel production deploy
    needs: security-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel commit status success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Vercel Git Integration status on ${SHA}"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            mapfile -t row < <(
              gh api "repos/${REPO}/commits/${SHA}/status" \
                --jq '
                  [.statuses[] | select(.context == "Vercel")][0] as $v
                  | if $v == null then ["missing", ""]
                    else [$v.state, ($v.target_url // "")]
                    end
                  | .[]
                '
            )
            state="${row[0]:-missing}"
            target_url="${row[1]:-}"

            echo "vercel_status=${state} url=${target_url:-n/a}"

            case "${state}" in
              success)
                echo "Vercel production deploy succeeded: ${target_url:-ok}"
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel production deploy failed (state=${state})"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "::error::Timed out waiting for Vercel status on ${SHA}"
          exit 1
