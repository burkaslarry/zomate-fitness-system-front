# [F015][S006] SRAA — Security Risk Assessment gate before merge/deploy
name: SRAA Pre-Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit fix (safe)
        run: npm audit fix || true

      - name: npm audit gate (high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    needs: security-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Load Vercel project link
        run: |
          if [[ -f .vercel/project.json ]]; then
            echo "VERCEL_ORG_ID=$(jq -r .orgId .vercel/project.json)" >> "$GITHUB_ENV"
            echo "VERCEL_PROJECT_ID=$(jq -r .projectId .vercel/project.json)" >> "$GITHUB_ENV"
          elif [[ -n "${{ secrets.VERCEL_ORG_ID }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
            echo "VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }}" >> "$GITHUB_ENV"
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}" >> "$GITHUB_ENV"
          else
            echo "::error::Missing Vercel project link. Commit .vercel/project.json (after vercel link) or set VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
