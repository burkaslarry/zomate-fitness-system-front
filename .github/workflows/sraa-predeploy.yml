# [F015][S006] SRAA — Security Risk Assessment gate before merge/deploy
name: SRAA Pre-Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit fix (safe)
        run: npm audit fix || true

      - name: npm audit gate (high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # Production deploys are owned by the Vercel Git integration (vercel[bot]).
  # The previous CLI deploy used secrets.VERCEL_TOKEN, which was empty and
  # failed every main push even when Vercel itself had already deployed.
  verify-vercel-production:
    name: Verify Vercel production deploy
    needs: security-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Wait for vercel[bot] Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Vercel Git Integration production deploy of ${SHA}"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            dep_id="$(
              gh api "repos/${REPO}/deployments?environment=Production&per_page=30" \
                --jq "[.[] | select(.sha == \"${SHA}\")][0].id // empty"
            )"

            if [[ -z "${dep_id}" ]]; then
              echo "No Production deployment yet for this SHA; retrying…"
              sleep 15
              continue
            fi

            state="$(
              gh api "repos/${REPO}/deployments/${dep_id}/statuses" \
                --jq '.[0].state // "pending"'
            )"
            url="$(
              gh api "repos/${REPO}/deployments/${dep_id}/statuses" \
                --jq '.[0].environment_url // .[0].target_url // empty'
            )"
            creator="$(
              gh api "repos/${REPO}/deployments/${dep_id}" \
                --jq '.creator.login // empty'
            )"

            echo "deployment=${dep_id} creator=${creator} state=${state} url=${url:-n/a}"

            case "${state}" in
              success)
                echo "Vercel production deploy succeeded: ${url:-ok}"
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel production deploy failed (state=${state})"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "::error::Timed out waiting for Vercel Production deployment of ${SHA}"
          exit 1
