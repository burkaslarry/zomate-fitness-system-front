# [F015][S006] SRAA — Security Risk Assessment gate before merge/deploy
name: SRAA Pre-Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit fix (safe)
        run: npm audit fix || true

      - name: npm audit gate (high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    needs: security-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      # [F015][S006] Vercel project macros (zomate-fitness-system-front)
      VERCEL_ORG_ID: team_e1pKe3eoQeeRYDzivUOsnvxM
      VERCEL_PROJECT_ID: prj_OHvcmEnmXNeaEZfrnS8rORCpDU50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Vercel project macros
        run: |
          [[ -n "${VERCEL_ORG_ID}" ]] || { echo "::error::Missing VERCEL_ORG_ID"; exit 1; }
          [[ -n "${VERCEL_PROJECT_ID}" ]] || { echo "::error::Missing VERCEL_PROJECT_ID"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
