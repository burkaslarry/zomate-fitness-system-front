<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect WhatsApp Onboarding</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        background: #f7f7fb;
        color: #111827;
      }
      .wrap {
        max-width: 760px;
        margin: 48px auto;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      p {
        color: #4b5563;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
      }
      pre {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #111827;
        color: #f9fafb;
        overflow-x: auto;
        min-height: 90px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>WhatsApp Connect Signup</h1>
      <p>Click the button to launch embedded signup via Facebook SDK.</p>
      <button onclick="launchSignup()">Connect WhatsApp</button>
      <pre id="log"></pre>
    </div>

    <script>
      const logEl = document.getElementById("log");
      function logLine(label, payload) {
        const next = `[${label}] ${typeof payload === "string" ? payload : JSON.stringify(payload, null, 2)}`;
        logEl.textContent = `${next}\n\n${logEl.textContent}`.trim();
      }
    </script>

    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "1866225351411888",
          autoLogAppEvents: true,
          xfbml: true,
          version: "v23.0"
        });
        logLine("SDK", "Facebook SDK initialized");
      };

      window.addEventListener("message", (e) => {
        if (!e.origin.endsWith("facebook.com")) return;
        console.log("SESSION:", e.data);
        logLine("SESSION", e.data);
      });

      function launchSignup() {
        if (!window.FB) {
          logLine("ERROR", "Facebook SDK not ready yet.");
          return;
        }
        FB.login(
          (r) => {
            console.log("CODE:", r);
            logLine("CODE", r);
          },
          {
            config_id: "1030391016563052",
            response_type: "code",
            override_default_response_type: true,
            extras: {
              setup: {},
              featureType: "whatsapp_business_app_onboarding",
              sessionInfoVersion: "3"
            }
          }
        );
      }
    </script>
  </body>
</html>
